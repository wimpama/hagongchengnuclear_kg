# Optional fragment for the BOTH existing future.artz.zone and futuredev.artz.zone TLS server blocks.
# Install as /etc/nginx/snippets/course-knowledge.conf, then include inside each TLS server.
# Do not replace /etc/nginx/conf.d/future.conf with this file.

location ^~ /kb-api/v1/knowledge/media/ {
    access_log off;
    error_log /dev/null crit;
    proxy_pass http://127.0.0.1:8080;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_cache off;
    proxy_buffering off;
    proxy_connect_timeout 5s;
    proxy_read_timeout 900s;
    add_header Referrer-Policy no-referrer always;
}

location ^~ /kb-api/ {
    client_max_body_size 125m;
    proxy_pass http://127.0.0.1:8080;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header Authorization $http_authorization;
    proxy_cache off;
    proxy_buffering off;
    proxy_connect_timeout 5s;
    proxy_read_timeout 900s;
}
