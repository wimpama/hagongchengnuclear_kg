[package]
name = "course-kb-server"
version = "0.1.0"
edition = "2021"
rust-version = "1.94"
description = "Independent knowledge-base service for the course frontend"
license = "UNLICENSED"

[dependencies]
anyhow = "1.0"
async-trait = "0.1"
axum = { version = "0.8", features = ["json", "tokio", "http1", "multipart"] }
aes-gcm = "0.10"
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
hmac = "0.12"
sha2 = "0.10"
async-stream = "0.3"
bytes = "1.10"
futures-core = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "http2", "stream"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio-rustls", "sqlite", "migrate", "macros", "uuid", "chrono"] }
thiserror = "2.0"
tokio = { version = "1.48", features = ["macros", "rt-multi-thread", "net", "signal", "fs", "io-util", "process", "sync", "time"] }
tower-http = { version = "0.6", features = ["trace", "request-id", "cors"] }
tower = { version = "0.5", features = ["util"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
uuid = { version = "1.18", features = ["v4", "v5", "serde"] }

[lints.rust]
unsafe_code = "forbid"

